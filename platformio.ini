; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:tenstar_esp32s3_tft]
platform = espressif32@6.4.0  ; Arduino core 2.0.14 (fixes TFT_eSPI issues)
board = adafruit_feather_esp32s3_tft
framework = arduino

; PSRAM – ESP32-S3FH4R2 has 2 MB OPI PSRAM bonded in-package (cannot be absent).
; qio_opi selects the Arduino core variant compiled with CONFIG_SPIRAM + CONFIG_SPIRAM_MODE_OCT.
; Without this the IDF never attempts OPI PSRAM init and ESP.getPsramSize() returns 0.
board_build.arduino.memory_type = qio_opi

; Serial port configuration
; COM3 = normal mode (239A:811D), COM4 = ROM bootloader (303A:1001)
; pre-upload script handles: 1200bps touch if on COM3, or uses COM4 directly if already in bootloader
; post-upload script handles: esptool --no-stub soft_reset to boot app, then waits for COM3
upload_port = COM4
upload_protocol = esptool
upload_flags =
    --after
    no_reset
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Post-upload: wait for board to reboot before opening monitor
extra_scripts = post:scripts/post_upload_delay.py

; Libraries
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BMP280 Library

; TFT display configuration (TENSTAR 1.14" ST7789)
build_flags = 
    -DUSER_SETUP_LOADED=1           ; tell TFT_eSPI to use these defines instead of User_Setup.h
    -DST7789_DRIVER=1               ; ST7789 controller
    -DTFT_WIDTH=135                 ; native portrait width (rotated → 240 wide)
    -DTFT_HEIGHT=240                ; native portrait height
    -DTFT_MOSI=35                   ; SPI data
    -DTFT_SCLK=36                   ; SPI clock
    -DTFT_CS=7                      ; chip select
    -DTFT_DC=39                     ; data/command
    -DTFT_RST=40                    ; reset
    -DTFT_BL=45                     ; backlight PWM
    -DLOAD_GLCD=1                   ; built-in 6×8 font (used for small labels)
    -DLOAD_FONT2=1                  ; built-in 7-segment 16px font
    -DLOAD_FONT4=1                  ; built-in 26px font (used for large values)
    -DSPI_FREQUENCY=40000000        ; 40 MHz SPI write (max stable for this board)
    -DSPI_READ_FREQUENCY=20000000   ; 20 MHz SPI read (reads need slower clock)
    -DBOARD_HAS_PSRAM               ; inform Arduino core + libs that PSRAM is present

; ── USB fast (no BLE) ────────────────────────────────────────────────────────
; Strips BLE stack → firmware ~835 KB → faster builds during development.
[env:tenstar_esp32s3_tft_usb_fast]
extends = env:tenstar_esp32s3_tft
build_flags =
    ${env:tenstar_esp32s3_tft.build_flags}
    -DNO_BLE

; ── OTA (wireless) upload ─────────────────────────────────────────────────────
; STEP 2: find the hostname in serial output: "OTA   : ready as [ESP32S3-XXXX.local]"
; STEP 3: replace XXXX below, then use this env for all future uploads.
[env:tenstar_esp32s3_tft_ota]
extends = env:tenstar_esp32s3_tft
upload_protocol = espota
upload_port = 192.168.178.89       ; direct IP — more reliable than ESP32S3-0F3C.local on Windows
upload_flags =                     ; clears esptool flags inherited from base env
;   --auth=your_ota_password       ; uncomment if OTA_PASSWORD is set in secrets.h
extra_scripts =                    ; clears the 1200bps-touch pre-upload script — not needed for OTA
monitor_port = COM3                ; still needs USB cable for serial — leave unplugged = no monitor

; ── OTA fast (no BLE) ─────────────────────────────────────────────────────────
; Strips BLE stack (~400 KB) → firmware ~1.0 MB → OTA upload ~35% faster.
; Use this env during active development, switch back to _ota for releases.
[env:tenstar_esp32s3_tft_ota_fast]
extends = env:tenstar_esp32s3_tft_ota
build_flags =
    ${env:tenstar_esp32s3_tft.build_flags}
    -DNO_BLE
